<svg xmlns="http://www.w3.org/2000/svg" width="350" height="200" viewBox="0 0 350 200" role="img" aria-label="GitHub activity">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1a1033"/><stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
</defs>
<style>
  text { font-family: 'Segoe UI', 'Noto Sans', 'Noto Sans Thai', Ubuntu, sans-serif; }
  .title { font-size: 17px; font-weight: 600; fill: #c4b5fd; }
  .label { font-size: 13px; fill: #8b949e; }
  .value { font-size: 15px; font-weight: 600; fill: #e6edf3; }
</style>
<rect x="0.5" y="0.5" width="349" height="199" rx="10" fill="url(#bg)" stroke="#3b2a6b"/>
<text x="24" y="36" class="title">GitHub activity</text>
<g><circle cx="30" cy="65" r="4" fill="#a78bfa"/><text x="44" y="70" class="label">Contributions (last year)</text><text x="326" y="70" class="value" text-anchor="end">525</text></g>
<g><circle cx="30" cy="91" r="4" fill="#a78bfa"/><text x="44" y="96" class="label">Commits</text><text x="326" y="96" class="value" text-anchor="end">510</text></g>
<g><circle cx="30" cy="117" r="4" fill="#a78bfa"/><text x="44" y="122" class="label">Pull requests</text><text x="326" y="122" class="value" text-anchor="end">12</text></g>
<g><circle cx="30" cy="143" r="4" fill="#a78bfa"/><text x="44" y="148" class="label">Public repositories</text><text x="326" y="148" class="value" text-anchor="end">3</text></g>
<g><circle cx="30" cy="169" r="4" fill="#a78bfa"/><text x="44" y="174" class="label">Stars</text><text x="326" y="174" class="value" text-anchor="end">1</text></g>
</svg>
